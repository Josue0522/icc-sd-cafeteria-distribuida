
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones - Cafetería Universitaria</title>
</head>
<body>

    <h1>Cafetería Universitaria</h1>
    <h2>Notificaciones de pedidos</h2>

    <label for="pedidoId">Identificador del pedido:</label>
    <input
        type="text"
        id="pedidoId"
        placeholder="Ingresa el UUID de tu pedido"
        size="40"
    >

    <button onclick="conectarPedido()">Conectar al pedido</button>

    <p id="conexion">Sin conexión</p>
    <h3 id="estado">Esperando notificaciones...</h3>

    <script>
        let socket = null;

        function conectarPedido() {
            const pedidoId = document
                .getElementById("pedidoId")
                .value.trim();

            const uuidValido =
                /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

            if (!uuidValido.test(pedidoId)) {
                alert("Ingresa un identificador UUID válido");
                return;
            }

            // Cerrar la conexión anterior, si existe
            if (socket !== null) {
                socket.close();
            }

            const nuevaConexion = new WebSocket(
                `ws://127.0.0.1:9003/ws/pedidos/${pedidoId}`
            );

            socket = nuevaConexion;

            document.getElementById("conexion").innerText =
                "Conectando...";

            document.getElementById("estado").innerText =
                "Esperando notificaciones...";

            nuevaConexion.onopen = function() {
                if (socket !== nuevaConexion) return;

                document.getElementById("conexion").innerText =
                    "Conectado al pedido " + pedidoId;
            };

            nuevaConexion.onmessage = function(event) {
                if (socket !== nuevaConexion) return;

                try {
                    const datos = JSON.parse(event.data);

                    document.getElementById("estado").innerText =
                        datos.mensaje;

                    console.log("Notificación recibida:", datos);

                } catch (error) {
                    console.error("Notificación inválida:", error);
                }
            };

            nuevaConexion.onclose = function() {
                if (socket !== nuevaConexion) return;

                document.getElementById("conexion").innerText =
                    "Desconectado del servidor";
            };

            nuevaConexion.onerror = function() {
                if (socket !== nuevaConexion) return;

                document.getElementById("conexion").innerText =
                    "Error de conexión";
            };
        }
    </script>

</body>
</html>
